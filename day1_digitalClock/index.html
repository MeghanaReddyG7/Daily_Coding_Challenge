<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./styles.css"> 
    <title>Digital Clock</title>
</head>
<body>
    <h1>Digital Clock</h1>
    <table>
        <tr>
            <td>Time: </td>
            <td id="time" >10:30:25</td>
        </tr>
        <tr>
            <td>Date: </td> 
            <td id="date" >23 Nov 2026</td>
        </tr>
        <tr>
            <td>Day: </td>
            <td id="day" >Monday</td>
        </tr>
    </table>
    <img  class ="clock" src="./clock.jpg">
    <img class ="clockMeme" src="./images(1).jpeg">
</body>
</html>
